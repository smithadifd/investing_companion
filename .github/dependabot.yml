version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    reviewers:
      - "smithadifd"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    reviewers:
      - "smithadifd"
    open-pull-requests-limit: 5
    groups:
      # react and react-dom must stay on the exact same version (#64)
      react:
        patterns:
          - "react"
          - "react-dom"
    ignore:
      # Tailwind v4 requires full config migration (CSS-first)
      - dependency-name: "tailwindcss"
        versions: [">=4.0.0"]
      # Zustand v5 — breaking API changes, evaluate separately
      - dependency-name: "zustand"
        versions: [">=5.0.0"]

  # Also covers root compose files (timescaledb, redis) — dev/demo/local/prod
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "monthly"
    ignore:
      # Only bump to stable LTS versions manually
      - dependency-name: "python"
        versions: [">=3.13"]
      - dependency-name: "node"
        versions: [">=23"]
