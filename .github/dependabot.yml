version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    reviewers:
      - "smithadifd"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    reviewers:
      - "smithadifd"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # react and react-dom must stay on the exact same version (#64).
      # First matching group wins, so this stays above minor-and-patch.
      react:
        patterns:
          - "react"
          - "react-dom"
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Tailwind v4 requires full config migration (CSS-first)
      - dependency-name: "tailwindcss"
        versions: [">=4.0.0"]
      # Zustand v5 — breaking API changes, evaluate separately
      - dependency-name: "zustand"
        versions: [">=5.0.0"]
      # TypeScript 7 deferred 2026-11-18: typescript-eslint (pulled in by
      # eslint-config-next) throws "does not support TS 7.0" on load, so
      # `npm run lint` cannot run. Remove this entry once typescript-eslint
      # supports TypeScript 7 (superseded PR: #308).
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: "npm"
    directory: "/docs-site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
      security:
        applies-to: security-updates
        patterns:
          - "*"

  # NOTE: root docker-compose image tags (timescaledb, redis) are NOT tracked by this or any entry — the deleted "/" block never found anything to scan (3 failed runs); tracking those needs its own correctly-configured entry (follow-up, not scoped here).
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Only bump to stable LTS versions manually
      - dependency-name: "python"
        versions: [">=3.13"]
      - dependency-name: "node"
        versions: [">=23"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # All actions in one PR (minor, patch and major together).
      github-actions:
        patterns:
          - "*"
