# Demo Docker Compose for Investing Companion
# Public demo at invest.smithadifd.com (EC2 behind Caddy)
#
# Usage:
#   docker compose -f docker-compose.demo.yml --env-file .env.demo up -d --build

services:
  # ===========================================
  # Database
  # ===========================================
  db:
    image: timescale/timescaledb:2.26.0-pg15
    container_name: investing_demo_db
    environment:
      POSTGRES_USER: investing_demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: investing_demo
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investing_demo -d investing_demo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - demo_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # ===========================================
  # Redis (Cache + Celery Broker)
  # ===========================================
  redis:
    image: redis:7.4.7-alpine
    container_name: investing_demo_redis
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - demo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - demo_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 96M

  # ===========================================
  # Backend API
  # ===========================================
  api:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend.prod
    container_name: investing_demo_api
    environment:
      - DATABASE_URL=postgresql+asyncpg://investing_demo:${POSTGRES_PASSWORD}@db:5432/investing_demo
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
      - CORS_ORIGINS=https://invest.smithadifd.com
      - REGISTRATION_ENABLED=false
      - DEMO_MODE=true
      # Contract docs served at /api/v1/export/contract-docs: the image build
      # context is ./backend, so docs/api/ is mounted read-only from the checkout.
      - CONTRACT_DOCS_DIR=/contract-docs
    volumes:
      - ./docs/api:/contract-docs:ro
    ports:
      - "8003:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - demo_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # ===========================================
  # Celery Worker (Background Tasks)
  # ===========================================
  celery_worker:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend.prod
    container_name: investing_demo_celery_worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://investing_demo:${POSTGRES_PASSWORD}@db:5432/investing_demo
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
      - DEMO_MODE=true
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    # Dockerfile.backend.prod's baked HEALTHCHECK curls :8000/health, which is
    # correct for the api service but meaningless here - celery workers run no
    # HTTP server on :8000, so that check can never pass. Override with a
    # celery-native liveness probe instead: broadcast an inspect ping over the
    # broker. Only one worker container is ever running in this deployment,
    # so a reply necessarily comes from (and confirms the health of) this
    # process - without depending on this container's node name matching a
    # `-d celery@<hostname>` destination.
    #
    # Review hardening (fresh-reviewer pass): `inspect ping` defaults its
    # reply-wait to 1.0s when `-t/--timeout` is omitted (verified against the
    # pinned celery==5.6.3 CLI source, celery/bin/control.py). That default
    # works but is undocumented-in-repo and version-fragile, and 1.0s leaves
    # little headroom under transient broker load (Redis persistence pause,
    # GC, etc.) before a healthy worker gets marked unhealthy. Pin it
    # explicitly to 5s - still inside this healthcheck's own `timeout:`
    # ceiling below, which remains the real backstop against a true hang
    # (e.g. broker connect() stalling, which `-t` does not bound).
    #
    # Cost: every probe boots a fresh Python process that imports the whole
    # app (~85% of a vCPU for several seconds). At a 30s interval that kept
    # the demo's t3.small above its 20% CPU baseline and billed burst
    # credits. Probe every 5 minutes instead; nothing consumes this status
    # (the deploy scripts health-check the HTTP ports only), and
    # `restart: unless-stopped` already covers a crashed worker. The 30s
    # `timeout:` matches celery_beat's earlier finding that the app boot
    # alone can exceed 10s on this host.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping --timeout=5"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 60s
    # Reap timed-out probe processes. Without an init, PID 1 is celery itself,
    # which does not reap orphans, and killed probes piled up as zombies.
    init: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - demo_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 200M

  # ===========================================
  # Celery Beat (Scheduler)
  # ===========================================
  celery_beat:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend.prod
    container_name: investing_demo_celery_beat
    environment:
      - DATABASE_URL=postgresql+asyncpg://investing_demo:${POSTGRES_PASSWORD}@db:5432/investing_demo
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
      - DEMO_MODE=true
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
    # No healthcheck for beat. The image's baked :8000/health curl can never
    # pass for a non-HTTP process, and the `inspect ping` override this
    # replaced only proved that some worker answered on the broker: celery
    # beat does not subscribe to the remote-control bus, so it said nothing
    # about beat itself. It also cost real money: each probe booted a second
    # copy of the app inside beat's 128M limit, got OOM-killed (exit 137),
    # left beat permanently "unhealthy", and helped keep the demo's t3.small
    # above its CPU baseline. Beat runs as the container's main process, so
    # if it dies the container exits and `restart: unless-stopped` brings it
    # back. A true beat-liveness signal (e.g. a schedule-file mtime
    # heartbeat) remains a possible follow-up.
    healthcheck:
      disable: true
    # Reap any orphaned child processes (same reason as celery_worker).
    init: true
    depends_on:
      celery_worker:
        condition: service_started
    networks:
      - demo_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # ===========================================
  # Frontend
  # ===========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend.prod
      args:
        - NEXT_PUBLIC_API_URL=/api/v1
        - NEXT_PUBLIC_DEMO_MODE=true
    container_name: investing_demo_frontend
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
      - NEXT_PUBLIC_DEMO_MODE=true
    ports:
      - "3013:3000"
    depends_on:
      api:
        condition: service_started
    networks:
      - demo_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  demo_postgres_data:
    name: investing_demo_postgres_data
  demo_redis_data:
    name: investing_demo_redis_data

networks:
  demo_network:
    name: investing_demo_network
