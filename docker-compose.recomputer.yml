# recomputer overrides, layered on docker-compose.local.yml (the file the NAS
# actually ran — NOT docker-compose.prod.yml, which brings a traefik that would
# fight Caddy for :80/:443 on this host).
#
# homepage runs host-networked here and already holds :3000, so the frontend
# moves to :3010. Caddy fronts both this and the Schwab OAuth callback host, so
# nothing outside this file needs to know the port changed.
services:
  frontend:
    ports: !override
      - "3010:3000"

  # The API serves the advisor contract docs (GET /api/v1/export/contract-docs)
  # from a read-only mount of docs/api/; the image build context is ./backend so
  # the docs are not baked in. docker-compose.local.yml already carries this;
  # it is restated here so this host cannot lose it if the base file changes.
  api:
    environment:
      - CONTRACT_DOCS_DIR=/contract-docs
    volumes:
      - ./docs/api:/contract-docs:ro
